<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restify</title>

    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <!-- <h1>Restify</h1> -->
    </header>

    <main>
        <div id="layout-grid">
            <!-- Fila 0 -->
            <div class="grid-cell r0c0 area-cycles" data-pos="0,0">
                <div class="temporizador" id="ciclos">
                    <label id="ciclos-label">Ciclos</label>
                    <input type="number" id="cycle-count" min="1" max="999" value="1"/>
                </div>
            </div>
            <div class="grid-cell r0c1 area-t1" data-pos="1,0">
                <div class="temporizador" id="temporizadorEstudio">
                    <label class = "temporizador-label">Tiempo de trabajo</label>
                    <div class="qt-row">
                        <input type="number" id="qt1-min" class="qt-min" min="0" max="60" value="0" />
                        <div class="text">min</div>
                        <input type="number" id="qt1-sec" class="qt-sec" min="0" max="60" value="0" />
                        <div class="text">seg</div>
                    </div>
                </div>
            </div>
            <div class="grid-cell r0c2 area-t2" data-pos="2,0">
                <div class="temporizador" id="temporizadorDescanso">
                    <label class = "temporizador-label">Tiempo de descanso</label>
                    <div class="qt-row">
                        <input type="number" id="qt2-min" class="qt-min" min="0" max="60" value="0" />
                        <div class="text">min</div>
                        <input type="number" id="qt2-sec" class="qt-sec" min="0" max="60" value="0" />
                        <div class="text">seg</div>
                    </div>
                </div>
            </div>
            <div class="grid-cell r0c3 area-controls" data-pos="3,0">
                <div class="temporizador" id="temporizadorControles">
                    <button class= "controles" id="qt1-start">Start</button>
                    <button class= "controles" id="qt1-pause">Pause</button>
                    <button class= "controles" id="qt1-reset">Reset</button>
                </div>
            </div>

            <!-- Fila 1 -->

            <div class="grid-cell r1c0 area-sudoku-board" data-pos="0,2">
                <div id="sudoku-container">
                    <h3>Sudoku</h3>
                    <div id="sudoku-board"></div>
                    <div class="sudoku-controls">
                        <button id="generate-sudoku">Generar Puzzle</button>
                        <button id="check-sudoku">Comprobar Solución</button>
                        <button id="clear-user-inputs">Resetear</button>
                    </div>
                    <div id="sudoku-message"></div>
                </div>
            </div>
            <div class="grid-cell r1c1 area-display1" data-pos="1,1">
                <div class="qt-display" id="qt1-display">00:00</div>
            </div>
            <div class="grid-cell r1c2 area-display2" data-pos="2,1">
                <div class="qt-display" id="qt2-display">00:00</div>
            </div>
            <div class="grid-cell r1c3 area-player" data-pos="3,1">
                <div id="player" class="player-wrapper">
                    <div class="player-inner">
                        <div id="player-track" class="player-track">No song selected</div>
                        <div id="player-progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <div id="player-progress-bar" class="progress-bar"></div>
                        </div>
                        <div class="player-controls">
                            <button id="player-rew" class="player-btn player-btn-rew" title="Retroceder" aria-label="Retroceder"></button>
                            <button id="player-play" class="player-btn player-btn-play" title="Reproducir" aria-label="Reproducir"></button>
                            <button id="player-pause" class="player-btn player-btn-pause" title="Pausar" aria-label="Pausar"></button>
                            <button id="player-fwd" class="player-btn player-btn-fwd" title="Avanzar" aria-label="Avanzar"></button>
                        </div>
                        <audio id="audio" preload="metadata"></audio>
                    </div>
                </div>
            </div>

            <!-- Fila 2 -->
            <div class="grid-cell r2c0" data-pos="0,2"></div>
            <div class="grid-cell r2c1" data-pos="1,2"></div>
            <div class="grid-cell r2c2" data-pos="2,2"></div>
            <div class="grid-cell r2c3" data-pos="3,2"></div>

            <!-- Fila 3 -->
            <div class="grid-cell r3c0" data-pos="0,3"></div>
            <div class="grid-cell r3c1" data-pos="1,3"></div>
            <div class="grid-cell r3c2" data-pos="2,3"></div>
            <div class="grid-cell r3c3" data-pos="3,3"></div>
        </div>
    </main>

    <footer>
    </footer>

    <!-- Scripts JS -->
    <script src="js/pomodoro.js"></script>
    <script src="js/player.js"></script>
    <script src="js/sudoku.js"></script>
 </body>
 </html>
